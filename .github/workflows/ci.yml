name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lane-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lane-gate
    runs-on: ubuntu-latest
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx convex deploy --cmd 'bun run build' --cmd-url-env-var-name VITE_CONVEX_URL
      - run: bunx static-hosting upload --prod --dist dist
      - run: bunx convex run --prod catalog/index:seed

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy the preview and build the app against it
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: bunx convex deploy --preview-name "$PREVIEW_NAME" --cmd 'bun run build' --cmd-url-env-var-name VITE_CONVEX_URL
      - name: Swap the preview deploy key for this preview's own admin key
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          [[ "$CONVEX_DEPLOY_KEY" =~ ^preview:([^:]+):([^|]+)\| ]]
          request=$(jq -n --arg name "$PREVIEW_NAME" --arg team "${BASH_REMATCH[1]}" --arg project "${BASH_REMATCH[2]}" \
            '{previewName: $name, projectSelection: {kind: "teamAndProjectSlugs", teamSlug: $team, projectSlug: $project}}')
          credentials=$(curl -sSf https://api.convex.dev/api/deployment/authorize_preview \
            -H "Authorization: Bearer $CONVEX_DEPLOY_KEY" -H "Content-Type: application/json" -d "$request")
          admin_key=$(jq -r .adminKey <<<"$credentials")
          url=$(jq -r .url <<<"$credentials")
          echo "::add-mask::$admin_key"
          echo "CONVEX_SELF_HOSTED_ADMIN_KEY=$admin_key" >> "$GITHUB_ENV"
          echo "CONVEX_SELF_HOSTED_URL=$url" >> "$GITHUB_ENV"
          echo "PREVIEW_SITE_URL=${url/.convex.cloud/.convex.site}" >> "$GITHUB_ENV"
      - run: bunx convex env set SITE_URL "$PREVIEW_SITE_URL"
      - run: bunx static-hosting upload --dist dist
      - run: bunx convex run catalog/index:seed
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Preview** of ${{ github.event.pull_request.head.sha }}: ${{ env.PREVIEW_SITE_URL }}
